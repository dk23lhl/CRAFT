# CRAFT HandWritten two-stage training configuration
# Usage: python main_mvc.py --config configs/train_mvc.yaml

dataset: handwritten
data_dir: ./data
train_ratio: 1.0
noise_std: 0.1
dropout_rate: 0.1

encoder_type: deep
embed_dim: 256
encoder_hidden_dim: 512
encoder_num_layers: 2
encoder_dropout: 0.1

fusion_type: transformer
fusion_n_heads: 4
fusion_n_layers: 1
fusion_dropout: 0.1
mask_strategy: attention_mask
aggregation: cls

cluster_temperature: 0.5

num_masked_views: 0
train_mask_prob: 0.0
missing_rate: 0.0

lambda_cluster: 1.0
lambda_entropy: 5.0
lambda_repr: 0.5
lambda_recon: 1.0
entropy_sample_weight: 0.1
cluster_loss_symmetric: true
entropy_warmup_epochs: 10
entropy_warmup_multiplier: 2.0

optimizer: adamw
lr: 0.0005
weight_decay: 0.0001
min_lr: 0.000001
use_scheduler: true
stage1_epochs: 100
max_epochs: 200
stage2_lr: 0.00001
batch_size: 256
num_workers: 4
seed: 42

eval_every: 5

output_dir: ./outputs
exp_name: quickstart_hw_s42
gpus: 1
